[package]
name = "lightningllm"
version = "0.1.0"
edition = "2021"

[dependencies]
llama-cpp-2 = { version = "0.1.7", features = ["vulkan"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.11", features = ["blocking"] }
indicatif = "0.17"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
